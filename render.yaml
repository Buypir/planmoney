databases:
  - name: planmoney-db
    plan: free

services:
  - type: web
    name: planmoney-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: planmoney-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://planmoney-client.onrender.com

  - type: web
    name: planmoney-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://planmoney-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
